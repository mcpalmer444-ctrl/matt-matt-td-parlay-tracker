services:
  - type: web
    name: matt-matt-td-parlay-tracker
    runtime: node
    plan: free
    buildCommand: npm install && npm run install:all && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: matt-matt-td-db
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: matt-matt-td-db
    plan: free
    databaseName: mattmatt
    user: mattmatt
